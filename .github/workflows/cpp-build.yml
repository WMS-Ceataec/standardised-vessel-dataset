name: C++ Build Pipeline

on:
  workflow_call:
    inputs:
      shell_scripts_path:
        type: string
        description: 'Path to shell scripts'
        required: true
      python_scripts_path:
        type: string
        description: 'Path to python scripts'
        required: true
      pr_title_regex:
        type: string
        description: 'PR Title Regex'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-test-and-analyze-job:
    name: Build Test and Analyze Job
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      SHELL_SCRIPTS_PATH: '${{ inputs.shell_scripts_path }}'
      PYTHON_SCRIPTS_PATH: '${{ inputs.python_scripts_path }}'
      PR_TITLE_REGEX: '${{ inputs.pr_title_regex }}'
      TAG_PREFIX: 'cpp-'
      BUILD_DIR: 'src/cpp/build'
      SOURCE_DIR: 'src/cpp'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1000
        fetch-tags: true

    #--------------TAGGING--------------

    - name: Tag the repository with new version
      if: github.ref == 'refs/heads/main'
      id: version-generator
      run: ${{ env.SHELL_SCRIPTS_PATH }}/apply_version.sh ${GITHUB_HEAD_REF#refs/heads/}

    #--------------BUILD--------------


    - name: Install dependencies
      working-directory: ${{ env.SOURCE_DIR }}
      run: sudo apt-get update && sudo apt-get install -y cmake g++

    - name: Create build directory
      working-directory: ${{ env.SOURCE_DIR }}
      run: mkdir -p build

    - name: Configure CMake
      working-directory: ${{ env.SOURCE_DIR }}/build
      run: cmake ..

    - name: Build project
      working-directory: ${{ env.SOURCE_DIR }}/build
      run: cmake --build . --config Release

    #--------------TESTS--------------


    - name: Run tests and collect results
      working-directory: ${{ env.SOURCE_DIR }}/build
      run: |
        ctest --output-on-failure --no-compress-output -T Test || true
        if [ -d "Testing" ]; then
          cp -r Testing ../test-results
        fi

    #--------------UPLOAD BUILD ARTIFACTS--------------


    - name: Upload C++ build artifacts
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: cpp-build-artifacts
        path: ${{ env.SOURCE_DIR }}/build/*
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: cpp-test-results
        path: ${{ env.SOURCE_DIR }}/test-results/**/*
        retention-days: 7

    #--------------GIT TAG PUSH--------------
    - name: Push git tags
      if: github.ref == 'refs/heads/main'
      run: |
        git push --tags || exit 4
